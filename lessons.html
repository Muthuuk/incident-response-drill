<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Automated Incident Response Lessons</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a broadcast studio — lesson rail on the left, 16:9 stage (slide + presenter) with captions and transport controls, quiz replaces the stage after each lesson */
:root{
  --bg:#EDF0F3; --panel:#FFFFFF; --sunk:#E3E8ED; --ink:#17202B; --muted:#5A6676; --line:#CBD3DC;
  --accent:#0B5D7A; --accent-ink:#FFFFFF; --accent-soft:#D6E8EF;
  --stage:#0F2A36; --stage-ink:#F2F6F8; --stage-muted:#9FB8C4; --stage-hi:#F2B35E;
  --crit:#B42318; --crit-soft:#FBE4E1; --ok:#1D7A46; --ok-soft:#DDF1E5; --warn:#A35A00;
  --skin:#C98E6B; --skin-dk:#A8704F; --hair:#2B211C; --jacket:#24495A; --shirt:#F4F6F8;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",Consolas,"Liberation Mono",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151C; --panel:#18202A; --sunk:#0C1117; --ink:#E4E9EF; --muted:#9AA6B4; --line:#2B3644;
  --accent:#5FB3D3; --accent-ink:#0A1A22; --accent-soft:#16323F;
  --stage:#0B1E27; --stage-ink:#F2F6F8; --stage-muted:#8FA9B5; --stage-hi:#F2B35E;
  --crit:#F28B82; --crit-soft:#3A1C1A; --ok:#6CCB93; --ok-soft:#163323; --warn:#F2B35E;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#10151C; --panel:#18202A; --sunk:#0C1117; --ink:#E4E9EF; --muted:#9AA6B4; --line:#2B3644;
  --accent:#5FB3D3; --accent-ink:#0A1A22; --accent-soft:#16323F;
  --stage:#0B1E27; --stage-ink:#F2F6F8; --stage-muted:#8FA9B5; --stage-hi:#F2B35E;
  --crit:#F28B82; --crit-soft:#3A1C1A; --ok:#6CCB93; --ok-soft:#163323; --warn:#F2B35E;
  color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0;padding-inline:16px;padding-block:16px 40px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(1.5rem,3vw,2.1rem);font-weight:700}
h2{font-size:1.2rem;font-weight:600}
p{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
button,select{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:.55rem 1rem;border-radius:var(--r);font-weight:600}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.head{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:end;justify-content:space-between}
.head .sub{color:var(--muted);max-width:60ch}
.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:16px;align-items:start}

/* lesson rail */
.rail{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:6px}
.lesson-btn{display:grid;grid-template-columns:2rem minmax(0,1fr);gap:8px;text-align:left;border:1px solid transparent;background:transparent;color:var(--ink);border-radius:var(--r);padding:8px}
.lesson-btn:hover{background:var(--sunk)}
.lesson-btn.on{border-color:var(--accent);background:var(--accent-soft)}
.lesson-btn .n{font-family:var(--f-mono);font-size:.8rem;width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--panel)}
.lesson-btn.done .n{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.lesson-btn b{font-family:var(--f-display);font-weight:600;display:block;line-height:1.2}
.lesson-btn small{color:var(--muted);font-size:.78rem}
.rail .total{border-top:1px solid var(--line);padding-top:10px;margin-top:4px;font-size:.85rem;color:var(--muted)}

/* stage */
.player{display:flex;flex-direction:column;gap:0;min-width:0}
.stage{background:var(--stage);color:var(--stage-ink);border-radius:var(--r) var(--r) 0 0;aspect-ratio:16/9;max-width:100%;display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);overflow:hidden;position:relative}
.slide{padding:clamp(14px,3.2%,36px);display:flex;flex-direction:column;gap:clamp(6px,1.4%,14px);min-width:0;overflow:hidden}
.slide .tag{font-family:var(--f-mono);font-size:clamp(.6rem,1.1vw,.75rem);letter-spacing:.1em;text-transform:uppercase;color:var(--stage-hi)}
.slide h2{font-size:clamp(1.05rem,2.5vw,1.9rem);color:var(--stage-ink);font-weight:700}
.slide ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:clamp(4px,1vw,10px)}
.slide li{font-size:clamp(.72rem,1.45vw,1.05rem);line-height:1.35;padding-left:1.1em;position:relative;color:var(--stage-muted);opacity:.28;transition:opacity .4s ease,color .4s ease}
.slide li::before{content:"";position:absolute;left:0;top:.5em;width:.45em;height:.45em;border-radius:2px;background:var(--stage-muted)}
.slide li.shown{opacity:1;color:var(--stage-ink)}
.slide li.now{color:var(--stage-hi)}
.slide li.now::before{background:var(--stage-hi)}
.flow{display:flex;flex-wrap:wrap;gap:6px}
.flow span{font-family:var(--f-mono);font-size:clamp(.58rem,1.05vw,.78rem);padding:.25em .6em;border:1px solid var(--stage-muted);border-radius:999px;color:var(--stage-muted);transition:all .4s ease}
.flow span.on{border-color:var(--stage-hi);color:var(--stage-hi)}
.presenter{position:relative;display:flex;align-items:flex-end;justify-content:center;min-width:0}
.presenter svg{width:100%;height:96%;display:block}
.presenter .name{position:absolute;left:8%;bottom:6%;font-family:var(--f-mono);font-size:clamp(.55rem,1vw,.72rem);background:var(--accent);color:var(--accent-ink);padding:.2em .6em;border-radius:3px}
#mouthA,#mouthB,#mouthC{transition:none}
.eyes{transform-origin:100px 96px;transition:transform .08s}
.eyes.blink{transform:scaleY(.1)}
.armR{transform-origin:138px 168px;transition:transform .6s cubic-bezier(.3,1.4,.5,1)}
.armR.point{transform:rotate(-58deg)}
.headg{transform-origin:100px 130px;transition:transform .5s ease}
.headg.tilt{transform:rotate(-4deg)}
.captions{background:var(--stage);color:var(--stage-ink);font-size:clamp(.85rem,1.6vw,1.05rem);padding:10px 16px 12px;min-height:3.6em;border-top:1px solid rgba(255,255,255,.08)}
.captions[hidden]{display:none!important}
.transport{background:var(--panel);border:1px solid var(--line);border-top:none;border-radius:0 0 var(--r) var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.prog{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.prog span{display:block;height:100%;background:var(--accent);width:0;transition:width .3s linear}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.ctrls .grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.icon-btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:var(--r);padding:.4rem .7rem;font-weight:500}
.icon-btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);min-width:6.5rem}
.time{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
select{padding:.35rem .5rem;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);color:var(--ink);max-width:14rem}
.chk{display:flex;gap:6px;align-items:center;font-size:.85rem}
.notice{font-size:.82rem;color:var(--muted)}

/* quiz */
.quiz{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.qcard{display:flex;flex-direction:column;gap:8px}
.qcard .qt{font-family:var(--f-display);font-size:1.1rem;font-weight:600}
.qopt{display:flex;gap:10px;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:var(--r);padding:9px 12px}
.qopt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.qopt .k{font-family:var(--f-mono);color:var(--accent);min-width:1.2em}
.qopt.right{border-color:var(--ok);background:var(--ok-soft)}
.qopt.wrong{border-color:var(--crit);background:var(--crit-soft)}
.qopt:disabled{cursor:default}
.why{font-size:.9rem;padding:10px 12px;border-radius:var(--r);background:var(--sunk)}
.dots{display:flex;gap:6px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--sunk);border:1px solid var(--line)}
.dots i.r{background:var(--ok);border-color:var(--ok)} .dots i.w{background:var(--crit);border-color:var(--crit)} .dots i.c{border-color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.result{font-family:var(--f-display);font-size:1.6rem;font-weight:700}
.record{font-family:var(--f-mono);font-size:.75rem;background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:10px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:200px;overflow:auto}

@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .rail{flex-direction:row;overflow-x:auto}
  .lesson-btn{min-width:200px}
  .rail .total{display:none}
}
@media (max-width:620px){
  .stage{grid-template-columns:minmax(0,1fr);aspect-ratio:auto}
  .presenter{height:150px;order:-1;justify-content:flex-start;padding-left:8px}
  .presenter svg{width:auto;height:150px}
  .presenter .name{left:130px;bottom:14px}
  .slide li{font-size:.85rem} .slide h2{font-size:1.15rem}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>

</head>
<body>
<div class="wrap">
  <header class="head">
    <div><p class="eyebrow">Chapter 15 · AI and Machine Learning in Cybersecurity</p><h1>Automated Incident Response Lessons</h1></div>
    <p class="sub">Five short video lessons, each about five minutes, with a quick quiz after each one. Press <b>Play</b> to start the presenter.</p>
  </header>
  <div class="layout">
    <nav class="rail" id="rail" aria-label="Lessons"></nav>
    <main class="player" id="player"></main>
  </div>
</div>

<script>
/* =====================================================================
   Video lessons for Chapter 15 — narrated by the browser's own voice.
   Portal set-up (optional), defined before this script:
     window.IRLESSON_CONFIG = { orgName:"…", passMark:75, postMessageOrigin:"https://portal.example.org" }
   After each quiz the page posts {type:"irlesson-result", …} to its parent frame.
   ===================================================================== */
var CFG=Object.assign({orgName:"",passMark:75,postMessageOrigin:"*"},window.IRLESSON_CONFIG||{});

/* Each slide: t = title, b = bullets, flow = optional chip row, s = script [[bulletIndex or -1, text], …] */
var LESSONS=[
{ title:"Why incident response needs automation", slides:"Slides 1–6",
  deck:[
  { tag:"Chapter 15", t:"Automated Incident Response and Orchestration", b:["AI and Machine Learning in Cybersecurity","Five lessons · about five minutes each · quiz after each"],
    s:[[-1,"Hello, and welcome to Chapter 15: automated incident response and orchestration."],
       [0,"This chapter is part of our course on AI and machine learning in cybersecurity."],
       [-1,"An incident is anything that threatens your systems or data. A phishing email that steals a password is an incident. So is ransomware locking your files."],
       [-1,"Incident response is everything you do from the moment you spot that problem to the moment you are safely back to normal."],
       [1,"We'll cover it in five short lessons. Each one lasts about five minutes and ends with a few quick questions to check your understanding."]]},
  { tag:"Learning objectives", t:"By the end of this chapter you will be able to", b:["Explain the basics of automated incident response","Identify machine learning methods used to detect threats","Design response workflows using playbooks","Evaluate SOAR platforms and how they are used","Analyse the challenges of AI-driven security automation"],
    s:[[-1,"Let's start with what you'll be able to do by the end."],
       [0,"First, explain the basic ideas behind automated incident response: what gets automated, and why."],
       [1,"Second, identify the machine learning methods that help computers spot threats."],
       [2,"Third, design response workflows using playbooks. A playbook is simply a written recipe of steps for handling a type of incident."],
       [3,"Fourth, evaluate SOAR platforms. SOAR stands for security orchestration, automation and response. These are the tools that bring all of this together."],
       [4,"And fifth, analyse the challenges, because automation brings new risks as well as benefits."]]},
  { tag:"The problem", t:"The incident response challenge", b:["Thousands of security alerts a day overwhelm security teams","Breaches take around 200 days to detect on average","Analysts face alert fatigue and skill shortages","Manual response can't keep pace with modern attacks","Organisations need machine-speed incident handling"],
    s:[[-1,"So why do we need automation at all?"],
       [0,"A typical security operations centre, or SOC, receives thousands of alerts every single day. Most are harmless. A few are serious. The hard part is telling them apart."],
       [1,"Industry studies show it takes around two hundred days, on average, for an organisation to discover it has been breached. That's more than six months of an attacker inside the network."],
       [2,"Analysts suffer from alert fatigue. When almost every alarm turns out to be false, people start to tune them out. And there simply aren't enough skilled analysts to go round."],
       [3,"Meanwhile, attackers use automated tools that move in minutes. A person working through alerts by hand cannot keep up."],
       [4,"So organisations need to handle incidents at machine speed, with people steering the important decisions."]]},
  { tag:"Fundamentals", t:"The incident response lifecycle", flow:["Preparation","Detection & analysis","Containment","Eradication","Recovery","Post-incident"],
    b:["Preparation: deploy detection tools and agree procedures","Detection & analysis: spot and classify incidents","Containment: isolate affected systems","Eradication: remove the threat completely","Recovery: restore systems to normal","Post-incident: learn and improve defences"],
    s:[[-1,"Every incident follows the same basic journey, called the incident response lifecycle. There are six stages."],
       [0,"Preparation happens before anything goes wrong. You install your detection tools and agree who does what."],
       [1,"Detection and analysis is spotting that something is wrong, and working out what kind of incident it is and how serious."],
       [2,"Containment means stopping it spreading. Think of closing the fire doors. You isolate the affected machines or accounts."],
       [3,"Eradication means removing the cause completely: the malware, the stolen password, the hole the attacker came through."],
       [4,"Recovery is bringing systems safely back into use, and watching closely in case the attacker returns."],
       [5,"And post-incident activity is the learning stage: what went well, what didn't, and what to change so the next incident is smaller."]]},
  { tag:"Fundamentals", t:"Where automation adds value", b:["Detection: machine learning spots threats at machine speed","Classification: sorts incidents by type and severity","Enrichment: pulls in threat intelligence in seconds","Response: runs agreed fixes automatically","Documentation: logs every action for reporting","Learning: improves from past incidents"],
    s:[[-1,"Automation can help at almost every stage of that lifecycle."],
       [0,"In detection, machine learning can sift millions of events and flag the unusual ones far faster than any person."],
       [1,"In classification, it can sort incidents automatically, for example: this is phishing, and it's high severity."],
       [2,"In enrichment, it gathers context in seconds. Has this web address been used in attacks before? Who owns this laptop?"],
       [3,"In response, it can carry out agreed actions, such as blocking a sender or isolating a machine."],
       [4,"In documentation, it records every step automatically, which saves hours when you write the report."],
       [5,"And in learning, each closed incident becomes training data that makes the system better next time."]]},
  { tag:"Worked example", t:"One phishing email, start to finish", flow:["Preparation","Detection & analysis","Containment","Eradication","Recovery","Post-incident"],
    b:["09:06 · fake ‘overdue invoice’ email reaches 14 finance staff","09:09 · one clerk types their password into a lookalike page","09:12 · alert raised, risk score 82 out of 100","09:21 · sessions ended, password reset, forwarding rule removed","Next day · payments checked by phone, account monitored","Review · playbook updated, model retrained, refresher training"],
    s:[[-1,"Let's follow one real-world style incident through all six stages, so the lifecycle feels concrete."],
       [0,"At six minutes past nine, an email titled ‘overdue invoice’ lands in fourteen mailboxes in a finance team. Because the company prepared well, its email filter and web proxy are both watching."],
       [1,"Three minutes later, one clerk clicks the link and types their Microsoft 365 password into a page that looks exactly like the real login page. It isn't."],
       [2,"At nine twelve, the system joins the dots and raises an alert with a risk score of eighty-two out of a hundred. That's detection and analysis: something is wrong, it's credential phishing, and it's serious."],
       [3,"Within minutes, the response team ends every open session on that account, resets the password, and removes a sneaky rule the attacker had set up to forward invoice emails outside the company. That's containment and eradication."],
       [4,"For recovery, finance double-checks any payment changes by phone, using numbers they already hold, and the account is watched closely for a month."],
       [5,"And in the post-incident review, nobody is blamed. Instead, the playbook gains an automatic check for forwarding rules, the model learns from the confirmed example, and the team gets a short refresher. Notice how automation sped up every stage, while people made the judgement calls. That's the end of lesson one. Let's check what you've learned."]]}
  ],
  quiz:[
   {q:"What is the main reason organisations automate incident response?",o:["To replace all security staff","To handle the huge volume and speed of alerts that people can't keep up with by hand","To avoid writing incident reports","Because regulators require AI"],a:1,w:"Thousands of alerts a day and fast-moving attacks are more than people can handle by hand. Automation handles the volume, and people steer the key decisions."},
   {q:"Which lifecycle stage is about stopping an incident from spreading?",o:["Preparation","Eradication","Containment","Recovery"],a:2,w:"Containment is like closing the fire doors. You isolate affected systems so the problem can't spread."},
   {q:"What is ‘alert fatigue’?",o:["Servers slowing down under too many alerts","Analysts tuning out alarms because most turn out to be false","A type of denial-of-service attack","Batteries running down in monitoring devices"],a:1,w:"When most alerts are false alarms, people start ignoring them, and real attacks get missed."},
   {q:"‘Enrichment’ in automated response means…",o:["Adding context, such as threat intelligence, to an alert quickly","Encrypting the alert","Deleting duplicate alerts","Paying analysts overtime"],a:0,w:"Enrichment gathers context in seconds, such as whether a web address is known to be malicious and who owns the device."}
  ]},
{ title:"How machine learning spots threats", slides:"Slides 7–10",
  deck:[
  { tag:"Machine learning for detection", t:"Teaching computers to spot attacks", b:["Learn patterns from data instead of hand-written rules","Three families: supervised, unsupervised, deep learning"],
    s:[[-1,"Welcome to lesson two: how machine learning spots threats."],
       [0,"Traditional security tools follow fixed rules written by people, such as ‘block this file’. Machine learning is different. It learns patterns from examples, a bit like how you learn to recognise a friend's handwriting."],
       [1,"We'll look at three families: supervised learning, unsupervised learning, and deep learning."]]},
  { tag:"Supervised learning", t:"Learning from labelled examples", b:["Random forests: many decision trees vote on the answer","Support vector machines: draw the best dividing line","Neural networks: learn complex, non-linear patterns","Needs labelled data: ‘normal’ vs ‘malicious’","Excellent for known types of threat","Can reach 95%+ accuracy on benchmark tests"],
    s:[[-1,"Supervised learning is learning with a teacher. You show the computer thousands of examples that are already labelled: this one is safe, this one is malicious."],
       [0,"A random forest builds many simple decision trees, each asking yes-or-no questions, then lets them vote. The majority wins, which makes it reliable."],
       [1,"A support vector machine draws the best possible dividing line between safe and malicious examples, leaving the widest gap it can."],
       [2,"Neural networks are loosely inspired by the brain. They can learn curved, complicated patterns that simple rules miss."],
       [3,"The catch is that all of these need labelled data, and labelling takes real expert time."],
       [4,"They work best for threats we've seen before, such as known families of malware or phishing."],
       [5,"On standard test datasets they can reach over ninety-five per cent accuracy. Real networks are messier, so expect lower figures in practice."]]},
  { tag:"Unsupervised learning", t:"Finding the odd one out", b:["K-means clustering: groups similar events together","Isolation forest: isolates unusual events quickly","Autoencoders: learn ‘normal’, flag what doesn't fit","No labels needed: finds patterns on its own","Key for spotting brand-new (zero-day) attacks","More false alarms, so needs careful tuning"],
    s:[[-1,"Unsupervised learning has no teacher. Nobody labels the data. The computer looks for structure on its own."],
       [0,"K-means clustering puts similar events into groups. If ten alerts land in the same group, they may be one incident."],
       [1,"An isolation forest works on a neat idea. Unusual things are easy to separate from the crowd, so the events that get isolated fastest are the most suspicious."],
       [2,"An autoencoder learns what normal looks like by trying to rebuild it. When it struggles to rebuild something, that something probably isn't normal."],
       [3,"Because no labels are needed, these methods are cheaper to set up."],
       [4,"And they're vital for brand-new attacks, called zero-days, that no labelled dataset contains yet."],
       [5,"The trade-off: unusual doesn't always mean bad. A finance team working late at year-end looks unusual too. So these methods raise more false alarms and need tuning."]]},
  { tag:"Deep learning", t:"Deep learning architectures", b:["CNNs: pick out features in network traffic","LSTMs: spot attack steps that unfold over time","Transformers: weigh which events matter most","Learn their own features from raw data","Handle messy, unstructured security data","Need lots of data and computing power"],
    s:[[-1,"Deep learning uses large neural networks with many layers."],
       [0,"Convolutional networks, or CNNs, were built for images, but they're also good at spotting patterns in network traffic, such as the shape of a data leak."],
       [1,"LSTMs have a kind of memory. They can notice a suspicious sequence: a login, then a permission change, then a large download, even when the steps are spread over time."],
       [2,"Transformers, the same idea behind modern chatbots, use attention. They work out which earlier events matter most to the current one."],
       [3,"A big advantage is that deep learning finds useful features by itself, rather than an expert choosing them by hand."],
       [4,"It can also work with raw, messy data such as log text."],
       [5,"But it needs a lot of training data and computing power, and it's harder to explain, which matters later."]]},
  { tag:"Worked example", t:"Three detectors, one suspicious login", b:["Supervised model: the email matches known phishing patterns","Isolation forest: a 3am login from a new country stands out","LSTM: login → new inbox rule → mass download is a risky sequence","Each sees a different part of the picture","Combined, they raise one confident, high-priority alert"],
    s:[[-1,"Let's see how these three families work together on a single case."],
       [-1,"Imagine an attacker has stolen a staff member's password with a phishing email, and logs in that night."],
       [0,"The supervised model, trained on thousands of labelled phishing emails, had already scored the original email as likely phishing. It recognised a familiar pattern: a lookalike web address and an urgent request for payment."],
       [1,"The isolation forest, which knows nothing about phishing, notices something else. This person has never logged in at three in the morning, or from that country. The login is easy to separate from normal behaviour, so it gets flagged as unusual."],
       [2,"The LSTM, with its memory, sees the sequence. A login, then a new rule to forward emails, then a large download of files. Each step alone might be innocent. Together, in that order, they look like an attack."],
       [3,"Each detector sees a different slice of the picture. On its own, each might produce a weak or uncertain alert that an analyst could easily dismiss."],
       [4,"Combined, they produce one strong, high-priority alert with the evidence attached. This is why mature security teams use several kinds of model rather than betting everything on one. That's lesson two. Time for your quiz."]]}

  p.appendChild(el('<div class="stage" id="stage"><div class="slide" id="slide"></div><div class="presenter">'+PRESENTER+'<span class="name">Your instructor</span></div></div>'));
  p.appendChild(el('<div class="captions" id="cap" aria-live="polite"'+(S.captions?"":" hidden")+'></div>'));
  var t=el('<div class="transport"><div class="prog"><span id="bar"></span></div><div class="ctrls">'+
   '<div class="grp"><button class="icon-btn" type="button" id="prev" aria-label="Previous slide">◀ Slide</button><button class="icon-btn primary" type="button" id="play">▶ Play</button><button class="icon-btn" type="button" id="next" aria-label="Next slide">Slide ▶</button><span class="time" id="time"></span></div>'+
   '<div class="grp"><label class="chk"><input type="checkbox" id="vo" '+(S.voiceOn?"checked":"")+'> Voice</label><label class="chk"><input type="checkbox" id="cc" '+(S.captions?"checked":"")+'> Captions</label>'+
   '<select id="rate" aria-label="Speed"><option value="0.85">0.85×</option><option value="1" selected>1×</option><option value="1.15">1.15×</option><option value="1.3">1.3×</option></select>'+
   '<select id="voice" aria-label="Voice"></select><button class="icon-btn" type="button" id="toquiz">Skip to quiz</button></div></div>'+
   '<p class="notice" id="notice">Lesson '+(S.L+1)+' of '+LESSONS.length+' · '+esc(ls.slides)+' · about '+fmt(lessonSecs(S.L))+' minutes. The voice comes from your browser, so it may sound different on each device.</p></div>');
  p.appendChild(t);
  document.getElementById("rate").value=String(S.rate);
  fillVoices(document.getElementById("voice"));
  if(!SYN){document.getElementById("vo").checked=false;document.getElementById("vo").disabled=true;S.voiceOn=false;document.getElementById("notice").textContent="This browser has no built-in voice, so the lesson plays with captions only."}
  document.getElementById("play").addEventListener("click",toggle);
  document.getElementById("prev").addEventListener("click",function(){jumpSlide(-1)});
  document.getElementById("next").addEventListener("click",function(){jumpSlide(1)});
  document.getElementById("vo").addEventListener("change",function(e){S.voiceOn=e.target.checked;restartSentence()});
  document.getElementById("cc").addEventListener("change",function(e){S.captions=e.target.checked;document.getElementById("cap").hidden=!S.captions});
  document.getElementById("rate").addEventListener("change",function(e){S.rate=+e.target.value;restartSentence()});
  document.getElementById("voice").addEventListener("change",function(e){S.voice=VOICES[+e.target.value]||null;restartSentence()});
  document.getElementById("toquiz").addEventListener("click",startQuiz);
  drawSlide(PLAN[POS]?PLAN[POS].slide:0, POS);
  setCaption(PLAN[POS]?PLAN[POS].text:"");
  updateTime();
}
function drawSlide(si,pos){
  var sl=LESSONS[S.L].deck[si], box=document.getElementById("slide"); if(!box)return;
  var shown=-1; for(var k=0;k<=pos&&k<PLAN.length;k++){ if(PLAN[k].slide===si&&PLAN[k].bullet>shown)shown=PLAN[k].bullet }
  var cur=PLAN[pos]&&PLAN[pos].slide===si?PLAN[pos].bullet:-1;
  box.innerHTML='<p class="tag">'+esc(sl.tag)+' · '+(si+1)+'/'+LESSONS[S.L].deck.length+'</p><h2>'+esc(sl.t)+'</h2>'+
    (sl.flow?'<div class="flow">'+sl.flow.map(function(f,i){return '<span class="'+((sl.b.length===sl.flow.length?i<=shown:shown>=1)?"on":"")+'">'+esc(f)+'</span>'}).join("")+'</div>':'')+
    '<ul>'+sl.b.map(function(b,i){return '<li class="'+(i<=shown?"shown":"")+(i===cur?" now":"")+'">'+esc(b)+'</li>'}).join("")+'</ul>';
}
function setCaption(t){var c=document.getElementById("cap");if(c)c.textContent=t}
function updateTime(){
  var done=0,total=0;PLAN.forEach(function(x,i){var w=words(x.text);total+=w;if(i<POS)done+=w});
  var b=document.getElementById("bar");if(b)b.style.width=(PLAN.length?POS/PLAN.length*100:0)+"%";
  var t=document.getElementById("time");if(t)t.textContent=fmt(done/2.55/S.rate)+" / "+fmt(total/2.55/S.rate);
}
function setPlayBtn(){var b=document.getElementById("play");if(b)b.textContent=S.playing?"❚❚ Pause":(POS>=PLAN.length?"↺ Replay":POS>0?"▶ Resume":"▶ Play")}

/* ---------------- playback ---------------- */
function toggle(){ if(S.playing){pause()}else{ if(POS>=PLAN.length)POS=0; S.playing=true; setPlayBtn(); speakCurrent(); } }
function pause(){S.playing=false;clearTimeout(S.timer);if(SYN)SYN.cancel();mouth(false);setPlayBtn()}
function restartSentence(){ if(S.playing){ clearTimeout(S.timer); if(SYN)SYN.cancel(); speakCurrent(); } }
var TOKEN=0;
function speakCurrent(){
  var my=++TOKEN;
  if(POS>=PLAN.length){ finishLesson(); return }
  var it=PLAN[POS]; drawSlide(it.slide,POS); setCaption(it.text); updateTime();
  if(it.first&&it.bullet>=0)gesture();
  var done=function(){ if(my!==TOKEN||!S.playing)return; mouth(false); POS++; S.timer=setTimeout(function(){ if(my===TOKEN&&S.playing)speakCurrent() }, PLAN[POS]&&PLAN[POS].slide!==it.slide?700:180) };
  mouth(true);
  if(S.voiceOn&&SYN){
    SYN.cancel();
    var u=new SpeechSynthesisUtterance(it.text.replace(/–/g," to ").replace(/→/g," to ").replace(/\+/g," plus "));
    if(S.voice)u.voice=S.voice; u.lang=S.voice?S.voice.lang:"en-GB"; u.rate=S.rate;
    u.onend=done; u.onerror=function(){ if(my===TOKEN&&S.playing){ S.timer=setTimeout(done, words(it.text)/2.55/S.rate*1000) } };
    u.onboundary=function(){ flap() };
    SYN.speak(u);
    /* safety net: some browsers never fire onend */
    var guard=Math.max(4000,words(it.text)/1.6/S.rate*1000+2500);
    S.timer=setTimeout(function(){ if(my===TOKEN&&S.playing){ SYN.cancel(); done() } },guard);
  } else {
    S.timer=setTimeout(done,Math.max(1800,words(it.text)/2.55/S.rate*1000));
  }
}
function jumpSlide(d){
  var cur=PLAN[Math.min(POS,PLAN.length-1)].slide, target=Math.max(0,Math.min(LESSONS[S.L].deck.length-1,cur+d));
  for(var k=0;k<PLAN.length;k++){ if(PLAN[k].slide===target){POS=k;break} }
  if(S.playing){ clearTimeout(S.timer); if(SYN)SYN.cancel(); speakCurrent() } else { drawSlide(target,POS); setCaption(PLAN[POS].text); updateTime(); setPlayBtn() }
}
function finishLesson(){
  S.playing=false; mouth(false); S.results[S.L].watched=true; save(); setPlayBtn(); updateTime();
  var b=document.getElementById("bar"); if(b)b.style.width="100%";
  setCaption("End of lesson "+(S.L+1)+". Starting your quiz…"); renderRail();
  S.timer=setTimeout(startQuiz,1600);
}

/* ---------------- presenter animation ---------------- */
var MOUTHS=["mouthA","mouthB","mouthC"];
function showMouth(i){MOUTHS.forEach(function(id,k){var m=document.getElementById(id);if(m)m.setAttribute("visibility",k===i?"visible":"hidden")})}
function flap(){showMouth(1+Math.floor(Math.random()*2))}
function mouth(on){ clearInterval(S.mouthT); if(on){ S.mouthT=setInterval(function(){ var r=Math.random(); showMouth(r<.3?0:r<.7?1:2) },120) } else showMouth(0) }
function gesture(){var a=document.getElementById("armR"),h=document.getElementById("headg");if(!a)return;a.classList.add("point");h&&h.classList.add("tilt");setTimeout(function(){a.classList.remove("point");h&&h.classList.remove("tilt")},1300)}
setInterval(function(){var e=document.getElementById("eyes");if(!e)return;e.classList.add("blink");setTimeout(function(){e.classList.remove("blink")},140)},3800);

/* ---------------- quiz ---------------- */
function startQuiz(){ pause(); S.quiz=true; S.qi=0; S.answers=[]; renderPlayer(); }
function renderQuiz(p){
  var ls=LESSONS[S.L], qz=ls.quiz;
  if(S.qi>=qz.length){ return renderScore(p) }
  var q=qz[S.qi], ans=S.answers[S.qi];
  var box=el('<section class="quiz" aria-live="polite"><div class="row"><div><p class="eyebrow">Lesson '+(S.L+1)+' quiz · question '+(S.qi+1)+' of '+qz.length+'</p><h2>'+esc(ls.title)+'</h2></div><div class="dots">'+qz.map(function(_,i){var a=S.answers[i];return '<i class="'+(a==null?(i===S.qi?"c":""):a===qz[i].a?"r":"w")+'"></i>'}).join("")+'</div></div>'+
   '<div class="qcard"><p class="qt">'+esc(q.q)+'</p><div class="qopts" style="display:flex;flex-direction:column;gap:8px"></div></div></section>');
  q.o.forEach(function(o,i){
    var b=el('<button class="qopt" type="button"><span class="k">'+"ABCD"[i]+'</span><span>'+esc(o)+'</span></button>');
    if(ans!=null){ b.disabled=true; if(i===q.a)b.classList.add("right"); else if(i===ans)b.classList.add("wrong") }
    else b.addEventListener("click",function(){S.answers[S.qi]=i;renderPlayer()});
    box.querySelector(".qopts").appendChild(b);
  });
  if(ans!=null){
    box.appendChild(el('<p class="why"><b>'+(ans===q.a?"Correct.":"Not quite.")+'</b> '+esc(q.w)+'</p>'));
    var n=el('<div class="row"><span></span><button class="btn" type="button">'+(S.qi===qz.length-1?"See my score":"Next question")+'</button></div>');
    n.querySelector("button").addEventListener("click",function(){S.qi++;renderPlayer()});box.appendChild(n);
  }
  p.appendChild(box);
}
function renderScore(p){
  var qz=LESSONS[S.L].quiz, right=S.answers.filter(function(a,i){return a===qz[i].a}).length, pct=Math.round(right/qz.length*100), pass=pct>=CFG.passMark;
  var best=S.results[S.L].score; S.results[S.L].score=best==null?pct:Math.max(best,pct); save(); renderRail();
  var rec={type:"irlesson-result",course:"Chapter 15: Automated Incident Response",organisation:CFG.orgName||null,lesson:S.L+1,lessonTitle:LESSONS[S.L].title,scorePercent:pct,passMark:CFG.passMark,passed:pass,
    lessonsPassed:S.results.filter(function(x){return x.score!=null&&x.score>=CFG.passMark}).length,totalLessons:LESSONS.length,completedAt:new Date().toISOString()};
  try{ if(window.parent&&window.parent!==window)window.parent.postMessage(rec,CFG.postMessageOrigin) }catch(e){}
  var last=S.L===LESSONS.length-1, allDone=rec.lessonsPassed===LESSONS.length;
  var box=el('<section class="quiz"><p class="eyebrow">Lesson '+(S.L+1)+' result</p><p class="result" style="color:var(--'+(pass?"ok":"crit")+')">'+right+' of '+qz.length+' correct · '+pct+'%</p>'+
    '<p>'+(pass?(allDone?"Well done. You've passed every lesson in this chapter.":"Passed. You're ready for the next lesson."):"Below the "+CFG.passMark+"% pass mark. Re-watch the lesson, then try the quiz again.")+'</p>'+
    '<div class="row" style="justify-content:flex-start"></div>'+(allDone?'<p class="eyebrow">Completion record</p><pre class="record">'+esc(JSON.stringify({course:rec.course,organisation:rec.organisation,lessons:S.results.map(function(r,i){return {lesson:i+1,score:r.score}}),completedAt:rec.completedAt},null,2))+'</pre>':'')+'</section>');
  var row=box.querySelector(".row");
  var again=el('<button class="btn ghost" type="button">'+(pass?"Re-watch lesson":"Re-watch and retry")+'</button>');again.addEventListener("click",function(){openLesson(S.L)});row.appendChild(again);
  var retry=el('<button class="btn ghost" type="button">Retry quiz</button>');retry.addEventListener("click",startQuiz);row.appendChild(retry);
  if(!last){var nx=el('<button class="btn" type="button">Next lesson ▶</button>');nx.addEventListener("click",function(){openLesson(S.L+1)});row.appendChild(nx)}
  p.appendChild(box);
}

/* ---------------- navigation ---------------- */
function openLesson(i){ pause(); TOKEN++; S.L=i; S.quiz=false; PLAN=plan(i); POS=0; renderRail(); renderPlayer(); }
renderRail(); renderPlayer();
</script>
